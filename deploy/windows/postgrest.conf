# PostgREST — configuration on-premise AeroTeam
# À placer dans C:\AeroTeam\postgrest\postgrest.conf

db-uri = "postgres://authenticator:MOT_DE_PASSE_AUTHENTICATOR@localhost:5432/aeroteam"
db-schemas = "public"
db-anon-role = "anon"

# Secret JWT : à générer (voir make-anon-key.ps1) et à conserver précieusement.
# La clé anon du front est signée avec ce secret.
jwt-secret = "REMPLACER_PAR_LE_SECRET_GENERE"

# Écoute locale uniquement : IIS fait le reverse proxy /rest/v1 → :3000
server-host = "127.0.0.1"
server-port = 3000

# Journaux
log-level = "info"
